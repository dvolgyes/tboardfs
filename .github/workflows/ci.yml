name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -n 8 --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Read a real event file from the installed wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "$RUNNER_TEMP"/wheels/tboardfs-*.whl
          export PATH="$RUNNER_TEMP/wheel-env/bin:$PATH"
          cd "$RUNNER_TEMP"
          source_file=$(find "$GITHUB_WORKSPACE/test-logs/tensorboard" -maxdepth 1 -type f -name 'events.out.tfevents*' -print -quit)
          tboardfs --help
          tboardfs-file list "$source_file" > typed-paths
          test -s typed-paths
          tboardfs-file copy-all --view raw "$source_file" extracted
          cat extracted/raw/*/*.tfrecord | cmp "$source_file" -

      - name: Upload coverage to Coveralls
        run: uv run coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
