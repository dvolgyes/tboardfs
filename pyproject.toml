[project]
name = "tboardfs"
version = "0.4.0"
description = "Read TensorBoard event logs as files through a FUSE filesystem."
readme = "README.md"
authors = [
    { name = "David Völgyes", email = "dvolgyes@deepconv.ai" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["fuse", "tensorboard", "filesystem", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    "cffi>=2.0,<3 ; implementation_name == 'cpython' and platform_machine == 'x86_64' and sys_platform == 'linux'",
    "click>=8.5.1,<9.0",
    "google-crc32c>=1.7,<2",
    "loguru>=0.8,<1.0",
    "mfusepy>=3.1.1,<4.0",
    "numpy>=2.5.5,<3.0",
    "orjson>=3.13.0,<4.0",
    "pandas>=3.1.1,<4.0",
    "protobuf>=7.36.2,<8.0",
    "puremagic>=2.3.0,<3.0",
    "xxhash>=4.1.0,<5.0",
]

[project.scripts]
tboardfs = "tboardfs:main"
tboardfs-file = "tboardfs.file_cli:main"

[build-system]
requires = [
    "setuptools>=84.2.1",
    "cffi>=2.0,<3 ; implementation_name == 'cpython' and platform_machine == 'x86_64' and sys_platform == 'linux'",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tboardfs", "tboardfs.*"]
namespaces = false

[tool.setuptools.package-data]
tboardfs = ["py.typed", "_sibling_stat.c", "llms.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "coverage>=7.14.1,<8.0",
    "coveralls>=4.1.0",
    "plyfile>=1.1.5,<2.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-xdist>=3.8.0,<4.0",
]
